services:
  - type: web
    name: release-checklist-api
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        fromDatabase:
          name: release-checklist-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /health

databases:
  - name: release-checklist-db
    databaseName: release_db
    user: release_user
    plan: free
