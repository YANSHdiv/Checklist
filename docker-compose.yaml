services:
  postgres:
    image: postgres:16-alpine
    container_name: release_checklist_db
    restart: unless-stopped
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: release_user
      POSTGRES_PASSWORD: release_password
      POSTGRES_DB: release_db
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U release_user -d release_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: release_checklist_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://release_user:release_password@postgres:5432/release_db
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      WORKERS: "4"
      DB_POOL_SIZE: "25"
      DB_MAX_OVERFLOW: "25"
      DB_POOL_TIMEOUT: "10.0"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
